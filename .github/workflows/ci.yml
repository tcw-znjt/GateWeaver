# CI：主分支 push / PR 时做静态检查与单元测试
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: src/go.sum
      - name: Vet & test
        run: cd src && go vet ./... && go test -count=1 ./...
      - name: Cross-compile check
        run: |
          cd src
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/gateweaver
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/gateweaver

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: src/go.sum
      - name: Build fpk
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gateweaver-fpk
          path: dist/*.fpk
