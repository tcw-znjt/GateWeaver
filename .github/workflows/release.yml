name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: src/go.sum

      - name: Test
        run: cd src && go vet ./... && go test ./...

      - name: Build fpk (amd64)
        run: VERSION="${VERSION#v}" FPK_ARCH=amd64 bash build.sh

      - name: Build fpk (arm64)
        run: VERSION="${VERSION#v}" FPK_ARCH=arm64 bash build.sh

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.fpk
          draft: false
          prerelease: false
          body: |
            GateWeaver ${{ github.ref_name }} —— 飞牛 fnOS 旁路由接管应用。

            资产说明：
            - `*.fpk`：fnOS 应用中心"手动安装"用的应用包（amd64 / arm64 各一）。
            - v0.3 起推荐搭配 root+TUN 全局接管版 clash-meta（见 tools/fork-clash-meta）。
            - 安装后请在管理台确认授权使用边界，仅用于您自有/已授权的网络设备。

            构建与验收流程见 README。
